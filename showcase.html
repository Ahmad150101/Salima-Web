<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="عرض تفاعلي لمنتجات سليمة">
  <meta property="og:title" content="عرض سليمة التفاعلي">
  <meta property="og:description" content="تجربة عرض لمنتجات سليمة وأقسامها">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://salima.ahmad150.com/showcase.html">
  <meta property="og:image" content="https://salima.ahmad150.com/assets/images/logo.png">
  <link rel="canonical" href="https://salima.ahmad150.com/showcase.html">
  <link rel="icon" href="assets/images/logo.png">

  <title>عرض سليمة التفاعلي</title>

<body>
  <header class="showcase-bar">
    <a href="index.html" class="show-logo" aria-label="سليمة"><img src="assets/images/logo.png" alt="سليمة"></a>
    <div class="show-progress"><span id="currentSlide">01</span><i><b id="progressBar"></b></i><span id="totalSlides">07</span></div>

      <button id="showLanguage" aria-label="Change language">EN</button>
      <button id="fullscreen" aria-label="ملء الشاشة">⛶</button>

    <button id="prev" aria-label="السابق">→</button><div id="dots"></div><button id="next" aria-label="التالي">←</button>

  <p class="show-hint" id="hint">استخدم الأسهم أو اسحب للتنقل</p>
