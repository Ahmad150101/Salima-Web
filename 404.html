<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>الصفحة غير موجودة | شركة سليمة</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#dcecff,transparent 32%),#f5f9ff;color:#071b3f;font-family:"Tajawal",sans-serif}.card{width:min(600px,100%);padding:48px 30px;border:1px solid #dce8f8;border-radius:30px;background:rgba(255,255,255,.88);text-align:center;box-shadow:0 25px 70px rgba(13,53,113,.14);backdrop-filter:blur(16px)}img{width:92px;margin:0 auto 18px}.code{color:#2674d9;font-size:clamp(4rem,14vw,7rem);font-weight:800;line-height:1}.card h1{margin-top:10px;font-size:clamp(1.7rem,6vw,2.6rem)}.card p{max-width:430px;margin:12px auto 25px;color:#66748a;line-height:1.8}.card a{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:11px 24px;border-radius:15px;background:linear-gradient(135deg,#0f3f8c,#2674d9);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 14px 28px rgba(23,87,184,.25)}
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.svg" alt="شعار شركة سليمة">
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>يبدو أن الرابط الذي فتحته غير صحيح أو أن الصفحة نُقلت. يمكنك العودة إلى كتالوج منتجات سليمة.</p>
    <a href="index.html">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>
