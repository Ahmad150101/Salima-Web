<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>الصفحة غير موجودة | شركة سليمة</title>
  <link rel="icon" href="./assets/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#dcecff,transparent 32%),#f5f9ff;color:#071b3f;font-family:"Tajawal",sans-serif}.card{width:min(600px,100%);padding:48px 30px;border:1px solid #dce8f8;border-radius:30px;background:rgba(255,255,255,.88);text-align:center;box-shadow:0 25px 70px rgba(13,53,113,.14);backdrop-filter:blur(16px)}.logo-link{display:inline-flex;align-items:center;justify-content:center;padding:5px 8px;margin:0 auto 18px;border-radius:14px;background:rgba(255,255,255,.64)}.logo-link img{display:block;width:142px;height:auto;max-height:76px;object-fit:contain;animation:logoReveal .75s cubic-bezier(.22,1,.36,1) both}.logo-link:hover img{transform:translateY(-2px) scale(1.03);filter:drop-shadow(0 7px 10px rgba(11,43,97,.14))}@keyframes logoReveal{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}.code{color:#2674d9;font-size:clamp(4rem,14vw,7rem);font-weight:800;line-height:1}.card h1{margin-top:10px;font-size:clamp(1.7rem,6vw,2.6rem)}.card p{max-width:430px;margin:12px auto 25px;color:#66748a;line-height:1.8}.card>a:last-child{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:11px 24px;border-radius:15px;background:linear-gradient(135deg,#0f3f8c,#2674d9);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 14px 28px rgba(23,87,184,.25)}@media(max-width:430px){.logo-link img{width:110px;max-height:59px}}@media(prefers-reduced-motion:reduce){.logo-link img{animation:none}.logo-link:hover img{transform:none}}
  </style>
</head>
<body>
  <main class="card">
    <a class="logo-link" href="./index.html" aria-label="العودة إلى الصفحة الرئيسية"><img src="./assets/images/logo.png" alt="شعار شركة سليمة" width="142" height="76"></a>
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>يبدو أن الرابط الذي فتحته غير صحيح أو أن الصفحة نُقلت. يمكنك العودة إلى كتالوج منتجات سليمة.</p>
    <a href="index.html">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>
