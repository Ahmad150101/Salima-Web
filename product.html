<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تفاصيل أحد منتجات شركة سليمة.">
  <meta name="theme-color" content="#0b2b61">
  <meta name="robots" content="index,follow">
  <meta property="og:site_name" content="سليمة | Salima">
  <meta property="og:title" content="تفاصيل المنتج | سليمة">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://salima.ahmad150.com/product.html">
  <meta property="og:image" content="https://salima.ahmad150.com/assets/images/logo.png">
  <link rel="canonical" href="https://salima.ahmad150.com/product.html">
  <link rel="icon" href="./assets/images/logo.png" type="image/png">
  <link rel="stylesheet" href="./css/style.css">
  <title>تفاصيل المنتج | شركة سليمة</title>
</head>
<body class="product-page-body">
  <header class="page-header">
    <div class="container">
      <a href="./index.html#products" class="logo-link" aria-label="شركة سليمة"><img src="./assets/images/logo.png" alt="شعار شركة سليمة" width="142" height="76"></a>
      <div class="nav-actions">
        <button class="language-btn" id="productLanguage" type="button" aria-label="Change language">EN</button>
        <button class="icon-btn" id="productTheme" type="button" aria-label="تفعيل الوضع الداكن">◐</button>
      </div>
    </div>
  </header>
  <main class="page-main">
    <div class="container">
      <a class="back-link" href="./index.html#products" id="productBack">← العودة إلى المنتجات</a>
      <section class="product-page-card" id="productPageCard" hidden>
        <div class="product-page-image-wrap"><img class="product-page-image" id="productPageImage" src="" alt="" width="1122" height="1402"></div>
        <div class="product-page-copy">
          <span class="product-category" id="productPageCategory"></span>
          <h1 id="productPageTitle"></h1>
          <p class="tagline" id="productPageTagline"></p>
          <div class="product-page-meta" id="productPageMeta"></div>
          <p class="product-page-description" id="productPageDescription"></p>
          <div class="product-page-details" id="productPageDetails"></div>
          <div class="actions">
            <button class="secondary-btn" id="productShare" type="button">مشاركة</button>
            <button class="secondary-btn" id="productCopy" type="button">نسخ الرابط</button>
          </div>
        </div>
      </section>
      <section class="related-section" id="productPageRelated" hidden><h2 id="productRelatedTitle">قد يعجبك أيضًا</h2><div class="products-grid" id="productRelatedGrid"></div></section>
      <section class="empty-state" id="productNotFound" hidden><h1>المنتج غير موجود</h1><p>تعذر العثور على المنتج المطلوب.</p><a class="primary-btn" href="./index.html#products">العودة إلى المنتجات</a></section>
    </div>
  </main>
  <script src="./js/products.js"></script>
  <script src="./js/product-v2.js"></script>
</body>
</html>
